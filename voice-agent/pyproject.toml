[project]
name = "demo-salon-voice-agent"
version = "0.1.0"
description = "Self-hosted phone voice agent (Pipecat + Twilio Media Streams + Deepgram + Claude) that books through the middleware tools"
requires-python = ">=3.12,<3.14"
dependencies = [
    # 1.12.0 (2026-09-26): posterior al arreglo de #5035/#5036 (peticiones a Claude rotas).
    # Extras SIN torch: silero y smart-turn v3 van por onnxruntime (dependencia base de pipecat).
    "pipecat-ai[anthropic,deepgram,azure,websocket]==1.12.0",
    "anthropic==1.11.0",
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "twilio==9.11.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[project.scripts]
voice-agent = "voice_agent.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q"

[tool.uv]
python-preference = "managed"
